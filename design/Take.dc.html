<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuggetfinder Drop a Take</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:'Space Grotesk',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #161514; color: #F5F0E6; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 16px; display: flex; flex-direction: column; gap: 12px">

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button aria-label="Close" style="width: 44px; height: 44px; background: transparent; border: 2px solid #F5F0E6; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#F5F0E6" stroke-width="2.5" stroke-linecap="square"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
    <span style="background: #FF4FA3; color: #161514; border: 2px solid #F5F0E6; padding: 6px 10px; font-weight: 700; font-size: 12px; letter-spacing: 0.06em">REBUTTAL TO @TENDERLOYALIST</span>
    <button aria-label="Flip camera" style="width: 44px; height: 44px; background: transparent; border: 2px solid #F5F0E6; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#F5F0E6" stroke-width="2.2" stroke-linecap="square"><path d="M4 8a6 6 0 0 1 10-3l2 2M16 12a6 6 0 0 1-10 3l-2-2"/><path d="M16 3v4h-4M4 17v-4h4"/></svg>
    </button>
  </div>

  <!-- camera preview -->
  <div style="position: relative; height: 396px; background: #2A2926; border: 3px solid #F5F0E6; overflow: hidden">
    <div style="position: absolute; left: 14px; top: 14px; width: 30px; height: 30px; border-top: 4px solid #F5F0E6; border-left: 4px solid #F5F0E6"></div>
    <div style="position: absolute; right: 14px; top: 14px; width: 30px; height: 30px; border-top: 4px solid #F5F0E6; border-right: 4px solid #F5F0E6"></div>
    <div style="position: absolute; left: 14px; bottom: 14px; width: 30px; height: 30px; border-bottom: 4px solid #F5F0E6; border-left: 4px solid #F5F0E6"></div>
    <div style="position: absolute; right: 14px; bottom: 14px; width: 30px; height: 30px; border-bottom: 4px solid #F5F0E6; border-right: 4px solid #F5F0E6"></div>
    <div style="position: absolute; left: 0; right: 0; top: 180px; text-align: center; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; color: #C9C3B6">CAMERA PREVIEW</div>

    <div style="position: absolute; left: 36px; top: 76px; transform: rotate(-6deg); background: #FF4FA3; color: #161514; border: 3px solid #161514; box-shadow: 3px 3px 0 #161514; padding: 6px 12px; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 20px; letter-spacing: 0.02em">SAUCE HERETIC</div>
    <div style="position: absolute; right: 38px; top: 286px; transform: rotate(5deg); background: #C8321F; color: #FFFFFF; border: 3px solid #161514; box-shadow: 3px 3px 0 #161514; padding: 6px 14px; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 22px; letter-spacing: 0.04em">NOPE</div>
  </div>

  <!-- timer row -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <span style="font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 22px; letter-spacing: 0.02em">0:00 / 0:15</span>
    <button style="height: 44px; padding: 0 14px; background: transparent; color: #F5F0E6; border: 2px solid #F5F0E6; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; cursor: pointer">EXTEND TO 0:30</button>
  </div>

  <!-- timer bar -->
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="position: relative; height: 12px; background: #3A3834; border: 2px solid #F5F0E6">
      <div style="position: absolute; left: 50%; top: -6px; width: 3px; height: 20px; background: #FF4FA3"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #C9C3B6"><span>0:00</span><span>0:15 default</span><span>0:30 max</span></div>
  </div>

  <!-- tags -->
  <div style="display: flex; gap: 10px">
    <button style="flex: 1; height: 44px; background: transparent; color: #F5F0E6; border: 2px dashed #F5F0E6; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; cursor: pointer">@ TAG A FRIEND</button>
    <button style="flex: 1; height: 44px; background: transparent; color: #F5F0E6; border: 2px dashed #F5F0E6; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; cursor: pointer"># ADD A SPOT</button>
  </div>

  <!-- sticker tray -->
  <div style="display: flex; gap: 8px">
    <button style="height: 44px; padding: 0 10px; background: #FF4FA3; color: #161514; border: 3px solid #F5F0E6; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; cursor: pointer">SAUCE HERETIC</button>
    <button style="height: 44px; padding: 0 10px; background: #F4B223; color: #161514; border: 3px solid #F5F0E6; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; cursor: pointer">CERTIFIED TENDER</button>
    <button style="height: 44px; padding: 0 10px; background: #C8321F; color: #FFFFFF; border: 3px solid #F5F0E6; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; cursor: pointer">NOPE</button>
    <button aria-label="More stickers" style="width: 44px; height: 44px; background: transparent; color: #F5F0E6; border: 2px solid #F5F0E6; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#F5F0E6" stroke-width="3" stroke-linecap="square"><path d="M9 3v12M3 9h12"/></svg>
    </button>
  </div>

  <!-- record row -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 76px">
    <button style="width: 76px; height: 44px; background: transparent; color: #F5F0E6; border: 2px solid #F5F0E6; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; cursor: pointer">UPLOAD</button>
    <button aria-label="Record" style="width: 76px; height: 76px; padding: 0; background: #C8321F; border: 5px solid #F5F0E6; border-radius: 50%; cursor: pointer"></button>
    <button style="width: 76px; height: 44px; background: transparent; color: #F5F0E6; border: 2px solid #F5F0E6; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; cursor: pointer">TIPS</button>
  </div>

  <!-- house rule -->
  <div style="text-align: center; font-size: 13px; line-height: 1.3; color: #C9C3B6">Roast the nugget, not the person. Reports from other users can pull a take down.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
